name: BarberFlow API CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "barber-flow-api/**"

  pull_request:
    branches:
      - develop
      - main
    paths:
      - "barber-flow-api/**"

jobs:
  build:
    name: Build & Validate API
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore barber-flow-api/BarberFlow.sln

      - name: 🏗️ Build (Release)
        run: dotnet build barber-flow-api/BarberFlow.sln --configuration Release --no-restore
